name: Deploy digierp.cloud VPS

on:
  push:
    branches: [sharaf]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SSH Key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh-keygen -lf /tmp/vps_key

      - name: SSH Preflight
        run: |
          ssh -i /tmp/vps_key \
            -p "${{ secrets.VPS_SSH_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "echo SSH OK: \$(whoami) on \$(hostname)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Deploy Folders
        shell: bash
        run: |
          set -e

          rm -rf deploy_app deploy_public
          mkdir -p deploy_app deploy_public

          # Core app files only
          cp -r app bootstrap config database routes artisan composer.json composer.lock phpunit.xml .htaccess Modules deploy_app/ 2>/dev/null || true

          # Translations and views
          if [ -d lang ]; then cp -r lang deploy_app/; fi
          mkdir -p deploy_app/resources
          [ -d resources/lang ] && cp -r resources/lang deploy_app/resources/
          [ -d resources/views ] && cp -r resources/views deploy_app/resources/

          # Laravel runtime skeleton for storage
          mkdir -p deploy_app/storage/app
          mkdir -p deploy_app/storage/framework/{cache,sessions,views}
          mkdir -p deploy_app/storage/logs
          mkdir -p deploy_app/bootstrap/cache
          touch deploy_app/storage/.gitignore

          # Public contents for document root
          rsync -a public/ deploy_public/

          # Ensure public/build is available under both root and laravel public
          mkdir -p deploy_app/public/build
          if [ -d public/build ]; then rsync -a public/build/ deploy_public/build/; fi
          if [ -d public/build ]; then rsync -a public/build/ deploy_app/public/build/; fi

          # Ensure .htaccess is included explicitly
          if [ -f public/.htaccess ]; then cp public/.htaccess deploy_public/.htaccess; fi

          # Write split docroot root index.php
          cat > deploy_public/index.php <<'PHP'
<?php

use Illuminate\Contracts\Http\Kernel;
use Illuminate\Http\Request;

define('LARAVEL_START', microtime(true));

// maintenance file relative to public docroot
if (file_exists($maintenance = __DIR__ . '/laravel/storage/framework/maintenance.php')) {
    require $maintenance;
}

// Point to the 'laravel' directory (relative to this docroot)
define('LARAVEL_BASE', __DIR__ . '/laravel');

require LARAVEL_BASE . '/vendor/autoload.php';
$app = require LARAVEL_BASE . '/bootstrap/app.php';

/** @var Kernel $kernel */
$kernel = $app->make(Kernel::class);

$response = tap($kernel->handle(
    $request = Request::capture()
))->send();

$kernel->terminate($request, $response);
PHP

      - name: Create Remote Folders
        run: |
          ssh -i /tmp/vps_key \
            -p "${{ secrets.VPS_SSH_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "mkdir -p /home/admin/domains/digierp.cloud/public_html/laravel"

      - name: Upload Laravel App
        run: |
          rsync -avz \
            --exclude=".env" \
            --exclude="vendor" \
            --exclude="storage" \
            -e "ssh -i /tmp/vps_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            deploy_app/ \
            ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/home/admin/domains/digierp.cloud/public_html/laravel/

      - name: Upload Public Files
        run: |
          rsync -avz \
            --exclude="laravel" \
            --exclude="storage" \
            -e "ssh -i /tmp/vps_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            deploy_public/ \
            ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/home/admin/domains/digierp.cloud/public_html/

      - name: SSH - Laravel Deploy Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/admin/domains/digierp.cloud/public_html/laravel

            if [ ! -f .env ]; then
              echo "❌ Missing .env file"
              exit 1
            fi

            mkdir -p storage/app/public
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs
            mkdir -p bootstrap/cache

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            cd /home/admin/domains/digierp.cloud/public_html

            rm -rf storage 2>/dev/null || true
            ln -sf laravel/storage/app/public storage

            chmod -R 775 /home/admin/domains/digierp.cloud/public_html/laravel/storage
            chmod -R 775 /home/admin/domains/digierp.cloud/public_html/laravel/bootstrap/cache

            chown -R admin:admin /home/admin/domains/digierp.cloud/public_html/laravel || true
            chown -R admin:admin /home/admin/domains/digierp.cloud/public_html || true

            echo "✅ Deployment completed successfully"