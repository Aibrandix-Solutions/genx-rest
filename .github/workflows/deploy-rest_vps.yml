name: Deploy digierp.cloud VPS

on:
  push:
    branches: [sharaf]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SSH Key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh-keygen -lf /tmp/vps_key

      - name: SSH Preflight
        run: |
          ssh -i /tmp/vps_key \
            -p "${{ secrets.VPS_SSH_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "echo SSH OK"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Assets
        run: |
          npm ci
          npm run build
          echo "Checking build output..."
          ls -la public || true
          ls -la public/build || true
          ls -la public/build/assets || true
          test -f public/build/manifest.json

      - name: Prepare Deploy Folders
        shell: bash
        run: |
          set -e

          rm -rf deploy_app deploy_public
          mkdir -p deploy_app deploy_public

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="vendor" \
            --exclude="storage" \
            --exclude="public" \
            --exclude="deploy_app" \
            --exclude="deploy_public" \
            ./ deploy_app/

          rsync -a public/ deploy_public/

          test -f deploy_public/build/manifest.json

          cat > deploy_public/index.php <<'PHP'
          <?php

          use Illuminate\Contracts\Http\Kernel;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          if (file_exists($maintenance = __DIR__ . '/laravel/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          define('LARAVEL_BASE', __DIR__ . '/laravel');

          require LARAVEL_BASE . '/vendor/autoload.php';

          $app = require_once LARAVEL_BASE . '/bootstrap/app.php';

          $kernel = $app->make(Kernel::class);

          $response = tap($kernel->handle(
              $request = Request::capture()
          ))->send();

          $kernel->terminate($request, $response);
          PHP

          cat > deploy_public/.htaccess <<'HTACCESS'
          <IfModule mod_rewrite.c>
              <IfModule mod_negotiation.c>
                  Options -MultiViews -Indexes
              </IfModule>

              RewriteEngine On

              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ index.php [L]
          </IfModule>
          HTACCESS

      - name: Create Remote Folders
        run: |
          ssh -i /tmp/vps_key \
            -p "${{ secrets.VPS_SSH_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "mkdir -p /home/admin/domains/digierp.cloud/public_html/laravel"

      - name: Upload Laravel App
        run: |
          rsync -avz \
            --exclude=".env" \
            --exclude="vendor" \
            --exclude="storage" \
            -e "ssh -i /tmp/vps_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            deploy_app/ \
            ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/home/admin/domains/digierp.cloud/public_html/laravel/

      - name: Upload Public Files
        run: |
          rsync -avz \
            --exclude="laravel" \
            --exclude="storage" \
            -e "ssh -i /tmp/vps_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            deploy_public/ \
            ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/home/admin/domains/digierp.cloud/public_html/

      - name: SSH - Laravel Deploy Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/admin/domains/digierp.cloud/public_html/laravel

            if [ ! -f .env ]; then
              echo "❌ Missing .env file"
              exit 1
            fi

            mkdir -p storage/app/public
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs
            mkdir -p bootstrap/cache

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            php artisan optimize:clear
            php artisan migrate:fresh --seed --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            cd /home/admin/domains/digierp.cloud/public_html
            rm -rf storage 2>/dev/null || true
            ln -sf laravel/storage/app/public storage

            chmod -R 775 /home/admin/domains/digierp.cloud/public_html/laravel/storage
            chmod -R 775 /home/admin/domains/digierp.cloud/public_html/laravel/bootstrap/cache
            chown -R admin:admin /home/admin/domains/digierp.cloud/public_html || true

            echo "✅ Deployment completed successfully"