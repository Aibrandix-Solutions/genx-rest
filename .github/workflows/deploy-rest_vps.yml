name: Deploy digierp.cloud VPS (rsync + SSH)

on:
  push:
    branches: [sharaf]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SSH private key format
        run: |
          set -e
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh-keygen -lf /tmp/vps_key

      - name: SSH preflight
        run: |
          ssh -i /tmp/vps_key \
              -p "${{ secrets.VPS_SSH_PORT }}" \
              -o StrictHostKeyChecking=no \
              -o IdentitiesOnly=yes \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
              "echo SSH OK: \$(whoami) on \$(hostname)"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Assets
        run: |
          npm ci
          npm run build

      - name: Prepare deploy artifacts
        shell: bash
        run: |
          set -e
          rm -rf deploy_app deploy_public
          mkdir -p deploy_app deploy_public

          cp -r app bootstrap config database routes artisan composer.json composer.lock phpunit.xml .htaccess Modules deploy_app/ 2>/dev/null || true

          if [ -d lang ]; then cp -r lang deploy_app/; fi
          mkdir -p deploy_app/resources
          [ -d resources/lang ]  && cp -r resources/lang  deploy_app/resources/
          [ -d resources/views ] && cp -r resources/views deploy_app/resources/

          mkdir -p deploy_app/storage/app
          mkdir -p deploy_app/storage/framework/{cache,sessions,views}
          mkdir -p deploy_app/storage/logs
          mkdir -p deploy_app/bootstrap/cache
          touch deploy_app/storage/.gitignore

          rsync -a public/ deploy_public/

          mkdir -p deploy_app/public/build
          if [ -d public/build ]; then rsync -a public/build/ deploy_public/build/; fi
          if [ -d public/build ]; then rsync -a public/build/ deploy_app/public/build/; fi

          if [ -f public/.htaccess ]; then cp public/.htaccess deploy_public/.htaccess; fi

          cat > deploy_public/index.php <<'PHP'
          <?php

          use Illuminate\Contracts\Http\Kernel;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          if (file_exists($maintenance = __DIR__ . '/laravel/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          define('LARAVEL_BASE', __DIR__ . '/laravel');

          require LARAVEL_BASE . '/vendor/autoload.php';
          $app = require LARAVEL_BASE . '/bootstrap/app.php';

          $kernel = $app->make(Kernel::class);

          $response = tap($kernel->handle(
              $request = Request::capture()
          ))->send();

          $kernel->terminate($request, $response);
          PHP

      - name: Create remote laravel folder
        run: |
          ssh -i /tmp/vps_key \
              -p "${{ secrets.VPS_SSH_PORT }}" \
              -o StrictHostKeyChecking=no \
              -o IdentitiesOnly=yes \
              "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
              "mkdir -p /home/admin/domains/digierp.cloud/public_html/laravel"

      - name: Upload app via rsync to laravel
        run: |
          rsync -avz \
            -e "ssh -i /tmp/vps_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            deploy_app/ ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/home/admin/domains/digierp.cloud/public_html/laravel/

      - name: Upload public via rsync to public_html
        run: |
          rsync -avz \
            --exclude="laravel" \
            -e "ssh -i /tmp/vps_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            deploy_public/ ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/home/admin/domains/digierp.cloud/public_html/

      - name: SSH - composer install and caches
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/admin/domains/digierp.cloud/public_html/laravel

            if [ ! -f .env ]; then
              echo "❌ Missing .env at /home/admin/domains/digierp.cloud/public_html/laravel/.env"
              exit 1
            fi

            mkdir -p storage/framework/{cache,sessions,views}
            mkdir -p storage/logs
            mkdir -p bootstrap/cache
            chmod -R 755 storage bootstrap/cache || true

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            php artisan optimize:clear || true
            php artisan module:publish || true
            php artisan module:publish-migration Inventory || true
            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            cd /home/admin/domains/digierp.cloud/public_html
            rm -rf user-uploads 2>/dev/null || true
            ln -sf /home/admin/domains/digierp.cloud/public_html/laravel/public/user-uploads user-uploads
            ls -la user-uploads || true