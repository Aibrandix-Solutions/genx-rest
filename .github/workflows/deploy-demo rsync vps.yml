name: Deploy digierp.cloud

on:
  push:
    branches: [vps]
  workflow_dispatch:

env:
  DOMAIN_NAME: digierp.cloud
  APP_PATH: /home/digierp.cloud/public_html/laravel
  PUBLIC_PATH: /home/digierp.cloud/public_html
  PHP_BIN: /usr/local/lsws/lsphp82/bin/php

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          set -e
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh-keygen -lf /tmp/vps_key

      - name: SSH preflight
        run: |
          ssh -i /tmp/vps_key \
            -p "${{ secrets.VPS_SSH_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "echo SSH OK: \$(whoami) on \$(hostname)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare deploy package
        shell: bash
        run: |
          set -e

          rm -rf deploy_app deploy_public
          mkdir -p deploy_app deploy_public

          # Core app (NO vendor, NO public)
          cp -r app bootstrap config database routes artisan composer.json composer.lock phpunit.xml .htaccess Modules deploy_app/ 2>/dev/null || true

          # Translations
          if [ -d lang ]; then cp -r lang deploy_app/; fi
          mkdir -p deploy_app/resources
          [ -d resources/lang ] && cp -r resources/lang deploy_app/resources/
          [ -d resources/views ] && cp -r resources/views deploy_app/resources/

          # Laravel runtime skeleton
          mkdir -p deploy_app/storage/app
          mkdir -p deploy_app/storage/framework/{cache,sessions,views}
          mkdir -p deploy_app/storage/logs
          mkdir -p deploy_app/bootstrap/cache
          touch deploy_app/storage/.gitignore

          # Public contents for the split-docroot webroot
          rsync -a public/ deploy_public/

          # Ensure public/build is deployed and also available under deploy_app/public/build
          mkdir -p deploy_app/public/build
          if [ -d public/build ]; then rsync -a public/build/ deploy_public/build/; fi
          if [ -d public/build ]; then rsync -a public/build/ deploy_app/public/build/; fi

          # Ensure .htaccess is included explicitly
          if [ -f public/.htaccess ]; then cp public/.htaccess deploy_public/.htaccess; fi

          # Write split-docroot index.php that points to ./laravel
          cat > deploy_public/index.php <<'PHP'
          <?php

          use Illuminate\Contracts\Http\Kernel;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          if (file_exists($maintenance = __DIR__ . '/laravel/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          define('LARAVEL_BASE', __DIR__ . '/laravel');

          require LARAVEL_BASE . '/vendor/autoload.php';
          $app = require LARAVEL_BASE . '/bootstrap/app.php';

          /** @var Kernel $kernel */
          $kernel = $app->make(Kernel::class);

          $response = tap($kernel->handle(
              $request = Request::capture()
          ))->send();

          $kernel->terminate($request, $response);
          PHP

      - name: Upload app to VPS
        run: |
          rsync -avz \
            -e "ssh -i /tmp/vps_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            deploy_app/ \
            ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:${{ env.APP_PATH }}/

      - name: Upload public to VPS
        run: |
          rsync -avz \
            -e "ssh -i /tmp/vps_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            deploy_public/ \
            ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:${{ env.PUBLIC_PATH }}/

      - name: Run Laravel deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            APP_PATH="${{ env.APP_PATH }}"
            PUBLIC_PATH="${{ env.PUBLIC_PATH }}"
            PHP_BIN="${{ env.PHP_BIN }}"

            cd "$APP_PATH"

            if [ ! -f .env ]; then
              echo "Missing .env at $APP_PATH/.env"
              exit 1
            fi

            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs
            mkdir -p bootstrap/cache

            chown -R nobody:nobody storage bootstrap/cache || true
            chmod -R 775 storage bootstrap/cache || true

            REQUIRED="mbstring intl bcmath curl dom fileinfo gd json openssl pdo pdo_mysql tokenizer xml sodium"
            MISSING=""

            for ext in $REQUIRED; do
              $PHP_BIN -m | grep -qi "^$ext$" || MISSING="$MISSING $ext"
            done

            if [ -n "$MISSING" ]; then
              echo "Missing PHP extensions:$MISSING"
              exit 1
            fi

            if ! command -v composer >/dev/null 2>&1; then
              $PHP_BIN -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
              $PHP_BIN composer-setup.php --install-dir=/usr/local/bin --filename=composer
              rm composer-setup.php
            fi

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            $PHP_BIN artisan optimize:clear

            $PHP_BIN artisan module:publish || true
            $PHP_BIN artisan module:publish-migration Inventory || true

            $PHP_BIN artisan migrate --force

            $PHP_BIN artisan storage:link || true

            rm -rf "$PUBLIC_PATH/storage" "$PUBLIC_PATH/user-uploads" 2>/dev/null || true
            ln -sfn "$APP_PATH/public/storage" "$PUBLIC_PATH/storage"
            ln -sfn "$APP_PATH/public/user-uploads" "$PUBLIC_PATH/user-uploads"

            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache
            $PHP_BIN artisan queue:restart || true

            systemctl restart lsws
