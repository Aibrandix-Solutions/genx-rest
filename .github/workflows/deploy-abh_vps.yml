name: Deploy abh.digierp.cloud VPS

on:
  push:
    branches: [abh]
  workflow_dispatch:

# Only one deploy at a time; cancel older runs so the latest abh code wins.
concurrency:
  group: deploy-abh-digierp-cloud
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Always deploy the abh branch, no matter how the workflow was triggered.
      - name: Checkout abh branch
        uses: actions/checkout@v4
        with:
          ref: abh

      - name: Confirm branch
        run: |
          echo "Deploying ref: $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit: $(git rev-parse HEAD)"

      - name: Validate SSH Key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh-keygen -lf /tmp/vps_key

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Assets
        run: |
          npm ci
          npm run build

      - name: Upload Project to VPS
        run: |
          rsync -avz --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="storage" \
            --exclude="bootstrap/cache" \
            --exclude="public/user-uploads" \
            -e "ssh -i /tmp/vps_key -p ${{ secrets.VPS_SSH_PORT }} -o StrictHostKeyChecking=no -o IdentitiesOnly=yes" \
            ./ ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/home/admin/domains/abh.digierp.cloud/public_html/

      - name: SSH - Laravel Deploy Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/admin/domains/abh.digierp.cloud/public_html

            if [ ! -f .env ]; then
              echo "Missing .env file"
              exit 1
            fi

            mkdir -p storage/app
            mkdir -p storage/framework/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/logs
            mkdir -p bootstrap/cache

            # -------------------------------------------------------
            # Persistent uploads symlink setup
            #
            # All uploaded images live in storage/app/public/user-uploads
            # which rsync never touches (storage + public/user-uploads
            # are both excluded). public/user-uploads is a symlink there.
            #
            # First deploy:  any existing real folder is migrated into
            #                storage, then replaced with the symlink.
            # Every deploy after that: symlink already exists, skip.
            # -------------------------------------------------------
            mkdir -p storage/app/public/user-uploads/temp

            if [ -d public/user-uploads ] && [ ! -L public/user-uploads ]; then
              echo "Migrating existing uploads into storage..."
              cp -a public/user-uploads/. storage/app/public/user-uploads/
              rm -rf public/user-uploads
              echo "Migration done."
            fi

            if [ ! -L public/user-uploads ]; then
              ln -sf "$(pwd)/storage/app/public/user-uploads" public/user-uploads
              echo "Symlink created: public/user-uploads -> storage/app/public/user-uploads"
            else
              echo "Symlink OK: public/user-uploads already points to storage."
            fi

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            chmod -R 775 storage bootstrap/cache
            chown -R admin:admin /home/admin/domains/abh.digierp.cloud/public_html || true

            echo "Deployment completed successfully"
